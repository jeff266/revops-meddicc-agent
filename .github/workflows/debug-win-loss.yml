name: Debug Win/Loss Generation

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    environment: Agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic supabase pyyaml python-dateutil

      - name: Run win/loss generation with debug
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/analytics/generate_win_loss.py --limit 1 --yes
