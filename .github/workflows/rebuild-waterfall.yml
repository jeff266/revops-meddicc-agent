name: Rebuild Waterfall and Verify

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    environment: Agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install supabase pyyaml python-dateutil

      - name: Rebuild and verify waterfall
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/analytics/rebuild_and_verify_waterfall.py
